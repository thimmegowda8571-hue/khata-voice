<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KhataVoice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">KhataVoice</div>
  <select id="lang" aria-label="Language">
    <option value="hi">हिन्दी</option><option value="en">English</option><option value="ta">தமிழ்</option>
    <option value="kn">ಕನ್ನಡ</option><option value="te">తెలుగు</option><option value="ml">മലയാളം</option>
    <option value="mr">मराठी</option><option value="bn">বাংলা</option>
  </select>
</header>
<div id="strip"></div>
<main>
  <section id="v-bolo">
    <button id="mic" class="mic" type="button" aria-label="Microphone">🎤</button>
    <p id="l-bolo" class="cap"></p>
    <textarea id="say" rows="2" autofocus></textarea>
    <button id="go" class="btn" type="button"></button>
    <div id="out" aria-live="polite"></div>
    <p class="mode" id="mode"></p>
  </section>
  <section id="v-khata" hidden><button id="add" class="btn" type="button"></button><ul id="list"></ul></section>
  <section id="v-hisaab" hidden><div id="sum"></div></section>
</main>
<nav><button data-v="bolo"></button><button data-v="khata"></button><button data-v="hisaab"></button></nav>
<dialog id="dlg">
  <label>👤 <input id="f-name" list="names" autocomplete="off"></label><datalist id="names"></datalist>
  <label>₹ <input id="f-total" type="number" min="0" inputmode="numeric"></label>
  <label>₹✔ <input id="f-paid" type="number" min="0" inputmode="numeric"></label>
  <label>🛒 <input id="f-items"></label>
  <p id="d-err" class="warn"></p>
  <div class="row"><button id="d-ok" class="btn" type="button">✔</button><button id="d-no" class="btn alt" type="button">✖</button></div>
</dialog>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
