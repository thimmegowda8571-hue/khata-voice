<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KhataVoice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>KhataVoice</h1>
  <select id="lang" aria-label="Language">
    <option value="hi">हिन्दी</option><option value="en">English</option><option value="kn">ಕನ್ನಡ</option>
  </select>
</header>
<main>
  <section id="v-bolo">
    <label for="say" id="l-bolo">बोलो</label>
    <textarea id="say" rows="3" autofocus></textarea>
    <div class="row">
      <button id="mic" class="big alt" type="button">🎤</button>
      <button id="go" class="big" type="button"></button>
    </div>
    <div id="out" aria-live="polite"></div>
    <p class="mode" id="mode"></p>
  </section>
  <section id="v-khata" hidden><ul id="list"></ul></section>
  <section id="v-hisaab" hidden><div id="sum"></div></section>
</main>
<nav>
  <button data-v="bolo" class="on"></button>
  <button data-v="khata"></button>
  <button data-v="hisaab"></button>
</nav>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
